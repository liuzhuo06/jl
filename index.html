<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打砖块 - 10关挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: #16213e;
            padding: 15px 15px 20px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.2);
            width: 100%;
            max-width: 500px;
            margin: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #eee;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .header .score-label span {
            color: #e94560;
            font-weight: bold;
            font-size: 17px;
        }
        .header .level-label {
            color: #f5a623;
            font-weight: bold;
            font-size: 16px;
        }
        .header .status {
            color: #f5a623;
            font-size: 13px;
            font-weight: bold;
            min-width: 70px;
            text-align: right;
        }
        .header .powerup-indicator {
            font-size: 13px;
            color: #6ab04c;
            min-width: 100px;
        }
        canvas {
            display: block;
            background: #0f1a30;
            border-radius: 8px;
            touch-action: none;
            width: 100%;
            height: auto;
            aspect-ratio: 600/400;
            cursor: none;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            min-height: 48px;
            flex: 1;
            max-width: 160px;
        }
        .btn-pause {
            background: #f5a623;
            color: #1a1a2e;
        }
        .btn-pause:active {
            transform: scale(0.94);
            background: #e09515;
        }
        .btn-pause.paused {
            background: #6ab04c;
        }
        .btn-pause.paused:active {
            background: #5a9e3e;
        }
        .btn-reset {
            background: #e94560;
            color: #fff;
        }
        .btn-reset:active {
            transform: scale(0.94);
            background: #d03a52;
        }
        .touch-hint {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 6px;
        }
        .touch-hint span {
            color: #888;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            color: #888;
            font-size: 11px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .legend-item .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .level-progress {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
            padding: 4px 0;
        }
        .level-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #555;
            transition: all 0.3s ease;
            background: #1a1a2e;
        }
        .level-dot.active {
            border-color: #f5a623;
            color: #f5a623;
            background: #2a2a4e;
            box-shadow: 0 0 15px rgba(245, 166, 35, 0.3);
        }
        .level-dot.completed {
            border-color: #6ab04c;
            color: #6ab04c;
            background: #1a3a2e;
        }
        .level-dot.locked {
            opacity: 0.3;
        }
        @media (max-width: 420px) {
            .game-wrapper { padding: 10px; margin: 5px; }
            .header { font-size: 11px; }
            .header .score-label span { font-size: 15px; }
            .controls button { padding: 8px 16px; font-size: 13px; min-height: 40px; }
            .legend { font-size: 10px; gap: 8px; }
            .level-dot { width: 18px; height: 18px; font-size: 8px; }
        }
        @media (min-width: 600px) {
            .game-wrapper { padding: 25px 30px 30px; }
            .header { font-size: 16px; }
            .controls button { padding: 10px 34px; font-size: 16px; min-height: auto; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="score-label">🏆 <span id="score">0</span></div>
            <div class="level-label" id="levelDisplay">🏁 第 1 关</div>
            <div class="powerup-indicator" id="powerupDisplay">✨ 道具: 无</div>
            <div class="status" id="statusDisplay">▶ 运行中</div>
        </div>

        <canvas id="game" width="600" height="400"></canvas>

        <div class="level-progress" id="levelProgress"></div>

        <div class="controls">
            <button class="btn-pause" id="pauseBtn">⏸ 暂停</button>
            <button class="btn-reset" id="resetBtn">🔄 重新开始</button>
        </div>

        <div class="touch-hint">
            <span>👆 滑动控制挡板 &nbsp;|&nbsp; 清空砖块进入下一关</span>
        </div>

        <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#f5a623;">⬤</span> 加宽</span>
            <span class="legend-item"><span class="dot" style="background:#6ab04c;">⬤</span> 大球</span>
            <span class="legend-item"><span class="dot" style="background:#3498db;">⬤</span> 分裂</span>
            <span class="legend-item"><span class="dot" style="background:#e94560;">⬤</span> 火焰</span>
            <span class="legend-item"><span class="dot" style="background:#9b59b6;">⬤</span> 减速</span>
        </div>
    </div>

    <script>
        // ===== DOM 元素 =====
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const levelDisplay = document.getElementById('levelDisplay');
        const statusDisplay = document.getElementById('statusDisplay');
        const powerupDisplay = document.getElementById('powerupDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const levelProgress = document.getElementById('levelProgress');

        // ===== 固定画布尺寸 =====
        const CW = 600;
        const CH = 400;

        // ===== 常量 =====
        const PADDLE_WIDTH = 80;
        const PADDLE_HEIGHT = 12;
        const BALL_RADIUS = 8;
        const BRICK_PADDING = 6;
        const BRICK_OFFSET_TOP = 30;
        const BRICK_OFFSET_LEFT = 20;
        const POWERUP_SIZE = 18;
        const POWERUP_SPEED = 1.8;
        const TOTAL_LEVELS = 10;

        // ===== 道具配置 =====
        const POWERUP_TYPES = {
            WIDE_PADDLE: { label: '挡板加宽', emoji: '📐', color: '#f5a623', duration: 5000 },
            BIG_BALL: { label: '球变大', emoji: '⚽', color: '#6ab04c', duration: 5000 },
            MULTI_BALL: { label: '分裂多球', emoji: '💥', color: '#3498db', duration: 0 },
            FIRE_BALL: { label: '火焰穿透', emoji: '🔥', color: '#e94560', duration: 4000 },
            SLOW_BALL: { label: '减速', emoji: '🐌', color: '#9b59b6', duration: 4000 }
        };

        const POWERUP_KEYS = Object.keys(POWERUP_TYPES);
        const POWERUP_COLORS = {
            'WIDE_PADDLE': '#f5a623',
            'BIG_BALL': '#6ab04c',
            'MULTI_BALL': '#3498db',
            'FIRE_BALL': '#e94560',
            'SLOW_BALL': '#9b59b6'
        };
        const POWERUP_EMOJIS = {
            'WIDE_PADDLE': '📐',
            'BIG_BALL': '⚽',
            'MULTI_BALL': '💥',
            'FIRE_BALL': '🔥',
            'SLOW_BALL': '🐌'
        };

        // ===== 状态 =====
        let score = 0;
        let currentLevel = 0;
        let isPaused = false;
        let gameOver = false;
        let animationId = null;
        let levelCompleted = false;
        let totalBricks = 0;

        // ===== 游戏对象 =====
        const paddle = {
            x: (CW - PADDLE_WIDTH) / 2,
            y: CH - 30,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dx: 6,
            targetWidth: PADDLE_WIDTH
        };

        const mainBall = {
            x: CW / 2,
            y: CH - 50,
            dx: 3.5,
            dy: -3.5,
            radius: BALL_RADIUS,
            targetRadius: BALL_RADIUS,
            isFire: false
        };

        let balls = [];
        let bricks = [];
        let powerups = [];
        let powerupTimers = {};

        // ============================================================
        //  🏗️ 关卡生成器（10关）
        // ============================================================

        function getLevelConfig(level) {
            // 基础配置
            const configs = [
                // 第1关：简单 5行x6列，速度慢
                { rows: 5, cols: 6, speed: 3.0, dropRate: 0.15, powerupCount: 3, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db'] },
                // 第2关：5行x7列，速度略快
                { rows: 5, cols: 7, speed: 3.3, dropRate: 0.20, powerupCount: 4, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db'] },
                // 第3关：6行x7列
                { rows: 6, cols: 7, speed: 3.6, dropRate: 0.25, powerupCount: 5, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6'] },
                // 第4关：6行x8列
                { rows: 6, cols: 8, speed: 3.9, dropRate: 0.28, powerupCount: 6, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6'] },
                // 第5关：7行x8列
                { rows: 7, cols: 8, speed: 4.2, dropRate: 0.30, powerupCount: 7, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c'] },
                // 第6关：7行x9列
                { rows: 7, cols: 9, speed: 4.5, dropRate: 0.32, powerupCount: 8, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c'] },
                // 第7关：8行x9列
                { rows: 8, cols: 9, speed: 4.8, dropRate: 0.35, powerupCount: 9, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c', '#e67e22'] },
                // 第8关：8行x10列
                { rows: 8, cols: 10, speed: 5.1, dropRate: 0.38, powerupCount: 10, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c', '#e67e22'] },
                // 第9关：9行x10列
                { rows: 9, cols: 10, speed: 5.4, dropRate: 0.40, powerupCount: 11, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c', '#e67e22', '#2ecc71'] },
                // 第10关：10行x10列，最快速度
                { rows: 10, cols: 10, speed: 5.8, dropRate: 0.45, powerupCount: 12, brickColors: ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db', '#9b59b6', '#1abc9c', '#e67e22', '#2ecc71', '#e74c3c'] }
            ];

            return configs[Math.min(level, configs.length - 1)];
        }

        function generateLevel(level) {
            const config = getLevelConfig(level);
            const rows = config.rows;
            const cols = config.cols;

            // 计算砖块尺寸
            const padding = BRICK_PADDING;
            const totalPaddingX = (cols + 1) * padding;
            const brickWidth = (CW - BRICK_OFFSET_LEFT * 2 - totalPaddingX) / cols;
            const brickHeight = Math.min(18, (CH - BRICK_OFFSET_TOP - 120) / rows);

            bricks = [];
            const colors = config.brickColors;

            // 确定哪些砖块掉落道具
            const totalBrickCount = rows * cols;
            const powerupCount = Math.min(config.powerupCount, Math.floor(totalBrickCount * 0.4));
            const dropPositions = [];
            const available = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    available.push({ r, c });
                }
            }
            // 随机打乱并选取
            for (let i = available.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [available[i], available[j]] = [available[j], available[i]];
            }
            for (let i = 0; i < Math.min(powerupCount, available.length); i++) {
                dropPositions.push(available[i]);
            }

            for (let r = 0; r < rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < cols; c++) {
                    const hasPowerup = dropPositions.some(p => p.r === r && p.c === c);
                    let powerupType = null;
                    if (hasPowerup) {
                        // 根据关卡级别，高级关卡更容易出好道具
                        const pool = ['WIDE_PADDLE', 'BIG_BALL', 'MULTI_BALL', 'FIRE_BALL', 'SLOW_BALL'];
                        // 第5关以后增加火焰和分裂的权重
                        if (level >= 4) {
                            pool.push('FIRE_BALL', 'MULTI_BALL');
                        }
                        if (level >= 7) {
                            pool.push('FIRE_BALL', 'MULTI_BALL', 'FIRE_BALL');
                        }
                        powerupType = pool[Math.floor(Math.random() * pool.length)];
                    }
                    bricks[r][c] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        color: colors[r % colors.length],
                        hasPowerup: hasPowerup,
                        powerupType: powerupType,
                        // 部分砖块有额外生命值（高级关卡）
                        hp: (level >= 6 && Math.random() < 0.2) ? 2 : 1,
                        maxHp: (level >= 6 && Math.random() < 0.2) ? 2 : 1
                    };
                }
            }

            // 更新砖块坐标
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const brick = bricks[r][c];
                    brick.x = c * (brickWidth + padding) + BRICK_OFFSET_LEFT;
                    brick.y = r * (brickHeight + padding) + BRICK_OFFSET_TOP;
                    brick.width = brickWidth;
                    brick.height = brickHeight;
                }
            }

            // 设置球速
            const speed = config.speed;
            const currentSpeed = Math.sqrt(mainBall.dx * mainBall.dx + mainBall.dy * mainBall.dy);
            if (currentSpeed > 0) {
                const ratio = speed / currentSpeed;
                mainBall.dx *= ratio;
                mainBall.dy *= ratio;
            } else {
                mainBall.dx = speed * (Math.random() > 0.5 ? 1 : -1);
                mainBall.dy = -speed;
            }
            // 应用速度到所有球
            balls.forEach(b => {
                const s = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                if (s > 0) {
                    const ratio = speed / s;
                    b.dx *= ratio;
                    b.dy *= ratio;
                }
            });

            // 重置球位置
            mainBall.x = CW / 2;
            mainBall.y = CH - 50;
            // 清空额外球
            balls = [];
            // 清空道具
            powerups = [];
            // 清除计时器
            for (const key in powerupTimers) {
                clearTimeout(powerupTimers[key]);
            }
            powerupTimers = {};
            // 重置道具状态
            mainBall.isFire = false;
            paddle.targetWidth = PADDLE_WIDTH;
            paddle.width = PADDLE_WIDTH;
            mainBall.targetRadius = BALL_RADIUS;
            mainBall.radius = BALL_RADIUS;
            powerupDisplay.textContent = '✨ 道具: 无';
            powerupDisplay.style.color = '#aaa';

            // 重置挡板位置
            paddle.x = (CW - paddle.width) / 2;

            totalBricks = rows * cols;
            levelCompleted = false;

            updateLevelProgress();
        }

        // ============================================================
        //  🖐️ 触屏控制
        // ============================================================

        let isTouching = false;
        let touchId = null;

        function getCanvasX(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CW / rect.width;
            let x = (clientX - rect.left) * scaleX;
            return Math.max(0, Math.min(CW, x));
        }

        function movePaddleTo(targetX) {
            if (gameOver || isPaused || levelCompleted) return;
            const halfWidth = paddle.width / 2;
            let newX = targetX - halfWidth;
            newX = Math.max(0, Math.min(CW - paddle.width, newX));
            paddle.x = newX;
        }

        function onTouchStart(e) {
            e.preventDefault();
            if (gameOver || isPaused || levelCompleted) return;
            const touch = e.touches[0];
            if (!touch) return;
            touchId = touch.identifier;
            isTouching = true;
            movePaddleTo(getCanvasX(touch.clientX));
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (!isTouching) return;
            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === touchId) {
                    touch = e.touches[i];
                    break;
                }
            }
            if (!touch) {
                touch = e.touches[0];
                touchId = touch ? touch.identifier : null;
            }
            if (!touch) return;
            movePaddleTo(getCanvasX(touch.clientX));
        }

        function onTouchEnd(e) {
            e.preventDefault();
            let stillThere = false;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === touchId) {
                    stillThere = true;
                    break;
                }
            }
            if (!stillThere) {
                isTouching = false;
                touchId = null;
            }
        }

        function onTouchCancel(e) {
            e.preventDefault();
            isTouching = false;
            touchId = null;
        }

        // ===== 鼠标支持 =====
        let isMouseDown = false;

        function onMouseDown(e) {
            if (gameOver || isPaused || levelCompleted) return;
            isMouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CW / rect.width;
            movePaddleTo((e.clientX - rect.left) * scaleX);
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CW / rect.width;
            movePaddleTo((e.clientX - rect.left) * scaleX);
        }

        function onMouseUp(e) { isMouseDown = false; }

        function onMouseLeave(e) { isMouseDown = false; }

        // ===== 注册事件 =====
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', onTouchCancel, { passive: false });

        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseLeave);

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());

        // ===== 键盘支持 =====
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                rightPressed = true;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
                leftPressed = true;
                e.preventDefault();
            } else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePause();
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                rightPressed = false;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
                leftPressed = false;
                e.preventDefault();
            }
        });

        // ===== 按钮事件 =====
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);
        pauseBtn.addEventListener('touchstart', (e) => e.stopPropagation());
        resetBtn.addEventListener('touchstart', (e) => e.stopPropagation());

        // ============================================================
        //  游戏逻辑
        // ============================================================

        function resetGame() {
            currentLevel = 0;
            score = 0;
            scoreSpan.textContent = '0';
            gameOver = false;
            isPaused = false;
            levelCompleted = false;
            pauseBtn.textContent = '⏸ 暂停';
            pauseBtn.classList.remove('paused');
            statusDisplay.textContent = '▶ 运行中';
            statusDisplay.style.color = '#f5a623';

            paddle.width = PADDLE_WIDTH;
            paddle.targetWidth = PADDLE_WIDTH;
            paddle.x = (CW - PADDLE_WIDTH) / 2;

            mainBall.radius = BALL_RADIUS;
            mainBall.targetRadius = BALL_RADIUS;
            mainBall.isFire = false;
            balls = [];
            powerups = [];
            for (const key in powerupTimers) {
                clearTimeout(powerupTimers[key]);
            }
            powerupTimers = {};

            generateLevel(currentLevel);
            updateLevelProgress();
            updateLevelDisplay();

            if (!animationId) {
                gameLoop();
            }
        }

        function togglePause() {
            if (gameOver || levelCompleted) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = '▶ 继续';
                pauseBtn.classList.add('paused');
                statusDisplay.textContent = '⏸ 已暂停';
                statusDisplay.style.color = '#6ab04c';
            } else {
                pauseBtn.textContent = '⏸ 暂停';
                pauseBtn.classList.remove('paused');
                statusDisplay.textContent = '▶ 运行中';
                statusDisplay.style.color = '#f5a623';
            }
        }

        function goToNextLevel() {
            if (currentLevel >= TOTAL_LEVELS - 1) {
                // 通关！
                gameOver = true;
                statusDisplay.textContent = '🎉 全部通关！';
                statusDisplay.style.color = '#f7dc6f';
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                setTimeout(() => alert('🎉🎉 恭喜你通关全部10关！太厉害了！ 🎉🎉'), 100);
                return;
            }

            currentLevel++;
            levelCompleted = false;
            generateLevel(currentLevel);
            updateLevelDisplay();
            updateLevelProgress();
            statusDisplay.textContent = `▶ 第 ${currentLevel + 1} 关`;
            statusDisplay.style.color = '#f5a623';

            // 重置球的位置
            mainBall.x = CW / 2;
            mainBall.y = CH - 50;
            balls = [];
            paddle.x = (CW - paddle.width) / 2;

            // 恢复游戏循环
            if (!animationId) {
                gameLoop();
            }
        }

        function updateLevelDisplay() {
            levelDisplay.textContent = `🏁 第 ${currentLevel + 1} 关`;
        }

        function updateLevelProgress() {
            levelProgress.innerHTML = '';
            for (let i = 0; i < TOTAL_LEVELS; i++) {
                const dot = document.createElement('div');
                dot.className = 'level-dot';
                dot.textContent = i + 1;
                if (i === currentLevel) {
                    dot.classList.add('active');
                } else if (i < currentLevel) {
                    dot.classList.add('completed');
                } else {
                    dot.classList.add('locked');
                }
                levelProgress.appendChild(dot);
            }
        }

                type: type,

                emoji: POWERUP_EMOJIS[type]
            });
        }

        function applyPowerup(type) {

                    powerupDisplay.style.color = POWERUP_COLORS[type];

                        powerupDisplay.textContent = '✨ 道具: 无';
                        powerupDisplay.style.color = '#aaa';

                    }, duration);
                    break;
                case 'BIG_BALL':

                        b.radius = b.targetRadius; });

                    powerupDisplay.style.color = POWERUP_COLORS[type];
