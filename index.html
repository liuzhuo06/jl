<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打砖块 - 触屏版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: #16213e;
            padding: 15px 15px 20px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.2);
            width: 100%;
            max-width: 500px;
            margin: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #eee;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .header .score-label span {
            color: #e94560;
            font-weight: bold;
            font-size: 18px;
        }
        .header .status {
            color: #f5a623;
            font-size: 13px;
            font-weight: bold;
            min-width: 70px;
            text-align: right;
        }
        .header .powerup-indicator {
            font-size: 13px;
            color: #6ab04c;
            min-width: 100px;
        }
        canvas {
            display: block;
            background: #0f1a30;
            border-radius: 8px;
            touch-action: none;
            width: 100%;
            height: auto;
            aspect-ratio: 600/400;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            min-height: 48px;
            flex: 1;
            max-width: 160px;
        }
        .btn-pause {
            background: #f5a623;
            color: #1a1a2e;
        }
        .btn-pause:active {
            transform: scale(0.94);
            background: #e09515;
        }
        .btn-pause.paused {
            background: #6ab04c;
        }
        .btn-pause.paused:active {
            background: #5a9e3e;
        }
        .btn-reset {
            background: #e94560;
            color: #fff;
        }
        .btn-reset:active {
            transform: scale(0.94);
            background: #d03a52;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            color: #888;
            font-size: 11px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .legend-item .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        /* 触屏提示（首次显示） */
        .touch-hint {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 6px;
        }
        .touch-hint span {
            color: #888;
        }
        @media (max-width: 420px) {
            .game-wrapper { padding: 10px; margin: 5px; }
            .header { font-size: 12px; }
            .header .score-label span { font-size: 16px; }
            .controls button { padding: 8px 16px; font-size: 13px; min-height: 40px; }
            .legend { font-size: 10px; gap: 8px; }
        }
        @media (min-width: 600px) {
            .game-wrapper { padding: 25px 30px 30px; }
            .header { font-size: 16px; }
            .controls button { padding: 10px 34px; font-size: 16px; min-height: auto; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="score-label">🏆 <span id="score">0</span></div>
            <div class="powerup-indicator" id="powerupDisplay">✨ 道具: 无</div>
            <div class="status" id="statusDisplay">▶ 运行中</div>
        </div>

        <canvas id="game" width="600" height="400"></canvas>

        <div class="controls">
            <button class="btn-pause" id="pauseBtn">⏸ 暂停</button>
            <button class="btn-reset" id="resetBtn">🔄 重新开始</button>
        </div>

        <div class="touch-hint">
            <span>👆 左右滑动控制挡板 &nbsp;|&nbsp; 点击按钮操作</span>
        </div>

        <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#f5a623;">⬤</span> 加宽</span>
            <span class="legend-item"><span class="dot" style="background:#6ab04c;">⬤</span> 大球</span>
            <span class="legend-item"><span class="dot" style="background:#3498db;">⬤</span> 分裂</span>
            <span class="legend-item"><span class="dot" style="background:#e94560;">⬤</span> 火焰</span>
            <span class="legend-item"><span class="dot" style="background:#9b59b6;">⬤</span> 减速</span>
        </div>
    </div>

    <script>
        // ===== DOM 元素 =====
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const statusDisplay = document.getElementById('statusDisplay');
        const powerupDisplay = document.getElementById('powerupDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ===== 画布尺寸适配 =====
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;

        // ===== 常量 =====
        const PADDLE_WIDTH = 80;
        const PADDLE_HEIGHT = 12;
        const BALL_RADIUS = 8;
        const BRICK_ROWS = 5;
        const BRICK_COLS = 8;
        const BRICK_WIDTH = 62;
        const BRICK_HEIGHT = 18;
        const BRICK_PADDING = 6;
        const BRICK_OFFSET_TOP = 30;
        const BRICK_OFFSET_LEFT = 20;
        const POWERUP_SIZE = 18;
        const POWERUP_SPEED = 1.8;

        // ===== 状态 =====
        let score = 0;
        let isPaused = false;
        let gameOver = false;
        let animationId = null;

        // ===== 游戏对象 =====
        const paddle = {
            x: (CANVAS_WIDTH - PADDLE_WIDTH) / 2,
            y: CANVAS_HEIGHT - 30,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dx: 6,
            targetWidth: PADDLE_WIDTH
        };

        const mainBall = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT - 50,
            dx: 3.5,
            dy: -3.5,
            radius: BALL_RADIUS,
            targetRadius: BALL_RADIUS,
            isFire: false
        };

        let balls = [];
        let bricks = [];
        let powerups = [];
        let powerupTimers = {};

        // ===== 道具配置 =====
        const POWERUP_TYPES = {
            WIDE_PADDLE: { label: '挡板加宽', emoji: '📐', color: '#f5a623', duration: 5000 },
            BIG_BALL: { label: '球变大', emoji: '⚽', color: '#6ab04c', duration: 5000 },
            MULTI_BALL: { label: '分裂多球', emoji: '💥', color: '#3498db', duration: 0 },
            FIRE_BALL: { label: '火焰穿透', emoji: '🔥', color: '#e94560', duration: 4000 },
            SLOW_BALL: { label: '减速', emoji: '🐌', color: '#9b59b6', duration: 4000 }
        };

        const POWERUP_KEYS = Object.keys(POWERUP_TYPES);
        const POWERUP_COLORS = {
            'WIDE_PADDLE': '#f5a623',
            'BIG_BALL': '#6ab04c',
            'MULTI_BALL': '#3498db',
            'FIRE_BALL': '#e94560',
            'SLOW_BALL': '#9b59b6'
        };
        const POWERUP_EMOJIS = {
            'WIDE_PADDLE': '📐',
            'BIG_BALL': '⚽',
            'MULTI_BALL': '💥',
            'FIRE_BALL': '🔥',
            'SLOW_BALL': '🐌'
        };

        // ============================================================
        //  🖐️ 触屏控制
        // ============================================================
        let touchX = null;
        let isTouching = false;

        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const touch = e.touches[0];
            const canvasX = (touch.clientX - rect.left) * scaleX;
            touchX = canvasX;
            isTouching = true;
            // 直接移动到触摸位置
            movePaddleTo(touchX);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isTouching) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const touch = e.touches[0];
            const canvasX = (touch.clientX - rect.left) * scaleX;
            touchX = canvasX;
            movePaddleTo(touchX);
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            isTouching = false;
            touchX = null;
        }

        function handleTouchCancel(e) {
            e.preventDefault();
            isTouching = false;
            touchX = null;
        }

        function movePaddleTo(targetX) {
            const halfWidth = paddle.width / 2;
            let newX = targetX - halfWidth;
            newX = Math.max(0, Math.min(CANVAS_WIDTH - paddle.width, newX));
            paddle.x = newX;
        }

        // ===== 鼠标支持（PC 调试） =====
        let isMouseDown = false;

        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const canvasX = (e.clientX - rect.left) * scaleX;
            isMouseDown = true;
            movePaddleTo(canvasX);
        }

        function handleMouseMove(e) {
            if (!isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const canvasX = (e.clientX - rect.left) * scaleX;
            movePaddleTo(canvasX);
        }

        function handleMouseUp(e) {
            isMouseDown = false;
        }

        // ===== 注册触屏/鼠标事件 =====
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchCancel, { passive: false });

        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('mouseleave', handleMouseUp);

        // ===== 键盘支持（调试用） =====
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                rightPressed = true;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
                leftPressed = true;
                e.preventDefault();
            } else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePause();
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                rightPressed = false;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
                leftPressed = false;
                e.preventDefault();
            }
        });

        // ============================================================
        //  游戏逻辑（与之前相同）
        // ============================================================

        function initBricks() {
            bricks = [];
            const colors = ['#e94560', '#f5a623', '#f7dc6f', '#6ab04c', '#3498db'];
            const dropCount = 6 + Math.floor(Math.random() * 3);
            const dropPositions = [];
            for (let i = 0; i < dropCount; i++) {
                dropPositions.push({
                    c: Math.floor(Math.random() * BRICK_COLS),
                    r: Math.floor(Math.random() * BRICK_ROWS)
                });
            }

            for (let c = 0; c < BRICK_COLS; c++) {
                bricks[c] = [];
                for (let r = 0; r < BRICK_ROWS; r++) {
                    const hasPowerup = dropPositions.some(p => p.c === c && p.r === r);
                    bricks[c][r] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        color: colors[r % colors.length],
                        hasPowerup: hasPowerup,
                        powerupType: hasPowerup ? POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)] : null
                    };
                }
            }
        }

        function resetGame() {
            paddle.x = (CANVAS_WIDTH - PADDLE_WIDTH) / 2;
            paddle.width = PADDLE_WIDTH;
            paddle.targetWidth = PADDLE_WIDTH;

            mainBall.x = CANVAS_WIDTH / 2;
            mainBall.y = CANVAS_HEIGHT - 50;
            mainBall.dx = 3.5 * (Math.random() > 0.5 ? 1 : -1);
            mainBall.dy = -3.5;
            mainBall.radius = BALL_RADIUS;
            mainBall.targetRadius = BALL_RADIUS;
            mainBall.isFire = false;

            balls = [];
            powerups = [];
            powerupTimers = {};

            initBricks();

            score = 0;
            scoreSpan.textContent = '0';
            gameOver = false;
            isPaused = false;
            pauseBtn.textContent = '⏸ 暂停';
            pauseBtn.classList.remove('paused');
            statusDisplay.textContent = '▶ 运行中';
            statusDisplay.style.color = '#f5a623';
            powerupDisplay.textContent = '✨ 道具: 无';
            powerupDisplay.style.color = '#aaa';

            rightPressed = false;
            leftPressed = false;

            if (!animationId) {
                gameLoop();
            }
        }

        function togglePause() {
            if (gameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = '▶ 继续';
                pauseBtn.classList.add('paused');
                statusDisplay.textContent = '⏸ 已暂停';
                statusDisplay.style.color = '#6ab04c';
            } else {
                pauseBtn.textContent = '⏸ 暂停';
                pauseBtn.classList.remove('paused');
                statusDisplay.textContent = '▶ 运行中';
                statusDisplay.style.color = '#f5a623';
            }
        }

        function spawnPowerup(x, y, type) {
            powerups.push({
                x: x + BRICK_WIDTH / 2 - POWERUP_SIZE / 2,
                y: y,
                width: POWERUP_SIZE,
                height: POWERUP_SIZE,
                type: type,
                color: POWERUP_COLORS[type],
                emoji: POWERUP_EMOJIS[type]
            });
        }

        function applyPowerup(type) {
            if (powerupTimers[type]) {
                clearTimeout(powerupTimers[type]);
                if (type === 'MULTI_BALL') return;
                if (type === 'FIRE_BALL') {
                    balls.forEach(b => b.isFire = false);
                    mainBall.isFire = false;
                }
            }

            const duration = POWERUP_TYPES[type].duration;
            const label = POWERUP_TYPES[type].label;
            const emoji = POWERUP_TYPES[type].emoji;

            switch (type) {
                case 'WIDE_PADDLE':
                    paddle.targetWidth = PADDLE_WIDTH * 1.6;
                    paddle.width = paddle.targetWidth;
                    if (paddle.x + paddle.width > CANVAS_WIDTH) {
                        paddle.x = CANVAS_WIDTH - paddle.width;
                    }
                    powerupDisplay.textContent = `${emoji} ${label} ${duration/1000}s`;
                    powerupDisplay.style.color = POWERUP_COLORS[type];
                    powerupTimers[type] = setTimeout(() => {
                        paddle.targetWidth = PADDLE_WIDTH;
                        paddle.width = PADDLE_WIDTH;
                        if (paddle.x + paddle.width > CANVAS_WIDTH) {
                            paddle.x = CANVAS_WIDTH - paddle.width;
                        }
                        powerupDisplay.textContent = '✨ 道具: 无';
                        powerupDisplay.style.color = '#aaa';
                        delete powerupTimers[type];
                    }, duration);
                    break;

                case 'BIG_BALL':
                    mainBall.targetRadius = BALL_RADIUS * 1.8;
                    mainBall.radius = mainBall.targetRadius;
                    balls.forEach(b => { b.targetRadius = BALL_RADIUS * 1.8;
                        b.radius = b.targetRadius; });
                    powerupDisplay.textContent = `${emoji} ${label} ${duration/1000}s`;
                    powerupDisplay.style.color = POWERUP_COLORS[type];
                    powerupTimers[type] = setTimeout(() => {
                        mainBall.targetRadius = BALL_RADIUS;
                        mainBall.radius = BALL_RADIUS;
                        balls.forEach(b => { b.targetRadius = BALL_RADIUS;
                            b.radius = BALL_RADIUS; });
                        powerupDisplay.textContent = '✨ 道具: 无';
                        powerupDisplay.style.color = '#aaa';
                        delete powerupTimers[type];
                    }, duration);
                    break;

                case 'MULTI_BALL':
                    const newBalls = [];
                    const allBalls = [mainBall, ...balls];
                    allBalls.forEach((b, i) => {
                        if (i > 0) return;
                        for (let j = 0; j < 2; j++) {
                            const angle = (j === 0 ? -0.4 : 0.4);
                            const speed = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                            const newBall = {
                                x: b.x + (j === 0 ? -15 : 15),
                                y: b.y,
                                dx: b.dx * Math.cos(angle) - b.dy * Math.sin(angle),
                                dy: b.dx * Math.sin(angle) + b.dy * Math.cos(angle),
                                radius: b.radius,
                                targetRadius: b.targetRadius || BALL_RADIUS,
                                isFire: b.isFire || false
                            };
                            const newSpeed = Math.sqrt(newBall.dx * newBall.dx + newBall.dy * newBall.dy);
                            if (newSpeed > 0) {
                                newBall.dx = (newBall.dx / newSpeed) * speed;
                                newBall.dy = (newBall.dy / newSpeed) * speed;
                            }
                            newBalls.push(newBall);
                        }
                    });
                    balls = [...balls, ...newBalls];
                    if (balls.length > 8) {
                        balls = balls.slice(0, 8);
                    }
                    powerupDisplay.textContent = `${emoji} ${label} +${newBalls.length}`;
                    powerupDisplay.style.color = POWERUP_COLORS[type];
                    setTimeout(() => {
                        if (powerupDisplay.textContent.includes('分裂')) {
                            powerupDisplay.textContent = '✨ 道具: 无';
                            powerupDisplay.style.color = '#aaa';
                        }
                    }, 1500);
                    break;

                case 'FIRE_BALL':
                    mainBall.isFire = true;
                    balls.forEach(b => b.isFire = true);
                    powerupDisplay.textContent = `${emoji} ${label} ${duration/1000}s`;
                    powerupDisplay.style.color = POWERUP_COLORS[type];
                    powerupTimers[type] = setTimeout(() => {
                        mainBall.isFire = false;
                        balls.forEach(b => b.isFire = false);
                        powerupDisplay.textContent = '✨ 道具: 无';
                        powerupDisplay.style.color = '#aaa';
                        delete powerupTimers[type];
                    }, duration);
                    break;

                case 'SLOW_BALL':
                    const slowFactor = 0.55;
                    mainBall.dx *= slowFactor;
                    mainBall.dy *= slowFactor;
                    balls.forEach(b => { b.dx *= slowFactor;
                        b.dy *= slowFactor; });
                    powerupDisplay.textContent = `${emoji} ${label} ${duration/1000}s`;
                    powerupDisplay.style.color = POWERUP_COLORS[type];
                    powerupTimers[type] = setTimeout(() => {
                        const restoreSpeed = (b) => {
                            const currentSpeed = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                            if (currentSpeed < 1) {
                                const scale = 3.5 / (currentSpeed || 1);
                                b.dx *= scale;
                                b.dy *= scale;
                            }
                        };
                        restoreSpeed(mainBall);
                        balls.forEach(restoreSpeed);
                        powerupDisplay.textContent = '✨ 道具: 无';
                        powerupDisplay.style.color = '#aaa';
                        delete powerupTimers[type];
                    }, duration);
                    break;
            }
        }

        function collisionDetection() {
            const allBalls = [mainBall, ...balls];
            const allBallsCopy = [...allBalls];

            for (let c = 0; c < BRICK_COLS; c++) {
                for (let r = 0; r < BRICK_ROWS; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 0) continue;

                    let hit = false;
                    for (const b of allBallsCopy) {
                        const closestX = Math.max(brick.x, Math.min(b.x, brick.x + BRICK_WIDTH));
                        const closestY = Math.max(brick.y, Math.min(b.y, brick.y + BRICK_HEIGHT));
                        const distX = b.x - closestX;
                        const distY = b.y - closestY;
                        const dist = Math.sqrt(distX * distX + distY * distY);

                        if (dist < b.radius) {
                            if (b.isFire) {
                                brick.status = 0;
                                score++;
                                scoreSpan.textContent = score;
                                if (brick.hasPowerup && brick.powerupType) {
                                    spawnPowerup(brick.x, brick.y, brick.powerupType);
                                }
                                hit = true;
                                continue;
                            }

                            const overlapX = Math.min(b.x - brick.x, brick.x + BRICK_WIDTH - b.x);
                            const overlapY = Math.min(b.y - brick.y, brick.y + BRICK_HEIGHT - b.y);

                            if (overlapX < overlapY) {
                                b.dx = -b.dx;
                            } else {
                                b.dy = -b.dy;
                            }

                            brick.status = 0;
                            score++;
                            scoreSpan.textContent = score;

                            if (brick.hasPowerup && brick.powerupType) {
                                spawnPowerup(brick.x, brick.y, brick.powerupType);
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) continue;
                }
            }

            let remaining = 0;
            for (let c = 0; c < BRICK_COLS; c++) {
                for (let r = 0; r < BRICK_ROWS; r++) {
                    if (bricks[c][r].status === 1) remaining++;
                }
            }
            if (remaining === 0) {
                gameOver = true;
                statusDisplay.textContent = '🎉 恭喜通关！';
                statusDisplay.style.color = '#6ab04c';
                pauseBtn.textContent = '⏸ 暂停';
                pauseBtn.classList.remove('paused');
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                setTimeout(() => alert('🎉 恭喜通关！点击「重新开始」再来一局'), 100);
            }
        }

        function updatePowerups() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += POWERUP_SPEED;

                if (p.y + p.height > paddle.y &&
                    p.y < paddle.y + paddle.height &&
                    p.x + p.width > paddle.x &&
                    p.x < paddle.x + paddle.width) {
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.y > CANVAS_HEIGHT) {
                    powerups.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 砖块 ---
            for (let c = 0; c < BRICK_COLS; c++) {
                for (let r = 0; r < BRICK_ROWS; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 0) continue;
                    const bx = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                    const by = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                    brick.x = bx;
                    brick.y = by;

                    ctx.beginPath();
                    ctx.rect(bx, by, BRICK_WIDTH, BRICK_HEIGHT);
                    ctx.fillStyle = brick.color;
                    ctx.fill();
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.strokeStyle = '#0f1a30';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    if (brick.hasPowerup) {
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.font = '14px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const emoji = POWERUP_EMOJIS[brick.powerupType] || '❓';
                        ctx.fillText(emoji, bx + BRICK_WIDTH / 2, by + BRICK_HEIGHT / 2 + 1);
                    }
                }
            }

            // --- 道具 ---
            for (const p of powerups) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = p.color + '99';
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y + p.height / 2, p.width / 2, 0, Math.PI * 2);
                ctx.fillStyle = p.color + 'dd';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y + p.height / 2, p.width / 2 - 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.fillText(p.emoji, p.x + p.width / 2, p.y + p.height / 2 + 1);
                ctx.shadowBlur = 0;
            }

            // --- 挡板 ---
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(233, 69, 96, 0.4)';
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            grad.addColorStop(0, '#f5f5f5');
            grad.addColorStop(1, '#c8c8c8');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;

            // --- 所有球 ---
            const allBalls = [mainBall, ...balls];
            for (const b of allBalls) {
                if (b.isFire) {
                    ctx.shadowBlur = 45;
                    ctx.shadowColor = '#e94560';
                } else {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255,255,255,0.2)';
                }
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                if (b.isFire) {
                    const grad2 = ctx.createRadialGradient(b.x - 3, b.y - 3, 2, b.x, b.y, b.radius);
                    grad2.addColorStop(0, '#fff');
                    grad2.addColorStop(0.3, '#ff6b6b');
                    grad2.addColorStop(0.7, '#e94560');
                    grad2.addColorStop(1, '#c0392b');
                    ctx.fillStyle = grad2;
                } else {
                    const grad2 = ctx.createRadialGradient(b.x - 3, b.y - 3, 2, b.x, b.y, b.radius);
                    grad2.addColorStop(0, '#ffffff');
                    grad2.addColorStop(0.6, '#f0f0f0');
                    grad2.addColorStop(1, '#a0a0a0');
                    ctx.fillStyle = grad2;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // --- 暂停遮罩 ---
            if (isPaused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸ 暂停中', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
                ctx.font = '16px Arial';
                ctx.fillStyle = '#aaa';
                ctx.fillText('点击「继续」恢复游戏', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 48);
            }

            // --- 游戏结束遮罩 ---
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 34px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const isWin = score === BRICK_ROWS * BRICK_COLS;
                ctx.fillText(isWin ? '🎉 恭喜通关！' : '💔 游戏结束', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 12);
                ctx.fillStyle = '#ccc';
                ctx.font = '18px Arial';
                ctx.fillText('得分: ' + score + ' 分', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 44);
                ctx.fillStyle = '#888';
                ctx.font = '15px Arial';
                ctx.fillText('点击「重新开始」再来一局', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 84);
            }
        }
