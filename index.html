<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>支付宝AI请求示例</title>
</head>
<body>
    <button onclick="callAlipayAPI()">发起请求</button>
    <pre id="result"></pre>

    <script>
        async function callAlipayAPI() {
            const url = 'https://webgw-internet.alipay.com/govbizprodsys/com.alipay.govbizprodsys.common.service.facade.gia.GovIntelligentAssistantFacade/chatInit';

            const headers = {
                'accept': '*/*',
                'accept-language': 'zh-CN,zh;q=0.9',
                'content-type': 'application/json',
                'origin': 'https://render.alipay.com',
                'referer': 'https://render.alipay.com/',
                'sec-ch-ua': '"Not=A?Brand";v="99", "Google Chrome";v="151", "Chromium";v="151"',
                'sec-ch-ua-mobile': '?1',
                'sec-ch-ua-platform': '"Android"',
                'sec-fetch-dest': 'empty',
                'sec-fetch-mode': 'cors',
                'sec-fetch-site': 'same-site',
                'starpoint-data2': '1.3ba09b8c19f14b538e26125ec5133e3f.NFI2NWpINXVPdzcwMDNJdQ==.1788850302.0075f224bd8883670b77ae877af676a0.LJGBAVXdAQH+5O2OfdVpt07nAnvLDUPFrzJZg3cZdXvg+nEMJdBRgIyBp3oaxXatA4ykop3yWG7feRgBzoyEbvW5Wa+dQLJvQ14MZKvMN3zk72/T/Lo4Utm/Dyx+NWWCqc3Z805i2emuqF63WJKYbQoGzFMrANy5GAZGf8GuHdzJqBl8AJp30ypuBw5K5fIAH3dsZoHqZXk+m4xGtPvoyw==',
                'user-agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36',
                'x-webgw-appid': '180020010001265922',
                'x-webgw-version': '2.0'
            };

            const body = JSON.stringify({
                appId: "2021003194657253",
                botId: "8e96fa1e7a6947d9a51699053582f837",
                channel: "app",
                openId: "e26d9927a85d81777360760751"
            });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: body,
                    mode: 'cors'  // 默认就是cors，显式标出
                });
debbuger
                //const data = await response.json();
                // document.getElementById('result').textContent = JSON.stringify(response, null, 2);

                 // ===== 调试信息 =====
                const resultDiv = document.getElementById('result');
                let debugInfo = `状态码: ${response.status} ${response.statusText}\n`;
                debugInfo += `Content-Type: ${response.headers.get('content-type') || '未知'}\n`;
                debugInfo += `Content-Length: ${response.headers.get('content-length') || '未知'}\n`;
                debugInfo += `\n--- 原始响应内容 ---\n`;


                debugInfo += JSON.stringify(response.headers)

                // 先以文本形式读取原始内容
                const text = await response.text();
                debugInfo += text || '(空响应)';

                resultDiv.textContent = debugInfo;

                // 如果文本是 JSON，再尝试解析
                try {
                    const jsonData = JSON.parse(text);
                    resultDiv.textContent = JSON.stringify(jsonData, null, 2);
                } catch (e) {
                    // 不是 JSON，保留文本显示
                    console.log('响应不是 JSON 格式');
                }
            } catch (error) {
                document.getElementById('result').textContent = '请求失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
