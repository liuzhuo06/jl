<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatInit fetch 对照测试</title>
<style>body{font:16px/1.6 sans-serif;max-width:1000px;margin:24px auto;padding:0 16px}button{padding:10px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f4;padding:16px}textarea{width:100%;height:120px}</style>
<h2>chatInit · window.fetch 对照测试</h2>
<p>每次运行发起 3 次 POST。请求头和 body 保持相同，只改变 fetch 配置。不设置浏览器管理的 Origin / Referer 请求头。</p>
<p>本地 file 页面与线上来源不同：若发生 CORS / Failed to fetch，不能据此判断业务页面也失败；重点比较是否出现 Invalid referrer policy。</p>
<textarea id="body">{"appId":"2021003194657","botId":"8e96fa1e7a6947d9a51053582f837","channel":"app","openId":"0387e5aac2f9481786435607365"}</textarea>
<p><button id="run">运行 3 组对照</button></p>
<pre id="output">等待运行</pre>
<script>
var url = 'https://webgw-internet.alipay.com/govbizprodsys/com.alipay.govbizprodsys.common.service.facade.gia.GovIntelligentAssistantFacade/chatInit';
var output = document.getElementById('output');
function log(data) {
  var line = JSON.stringify(data);
  output.textContent += line + '\n';
  console.log(line);
}
document.getElementById('run').onclick = async function () {
  var button = this;
  var body;
  try { body = JSON.stringify(JSON.parse(document.getElementById('body').value)); }
  catch (e) { output.textContent = 'body 不是合法 JSON: ' + e.message; return; }
  button.disabled = true;
  output.textContent = '';
  log({ origin: location.origin, protocol: location.protocol, userAgent: navigator.userAgent });
  var cases = [
    { name: 'A 最简请求', extra: {} },
  ];
  try {
    for (var item of cases) {
      // var options = Object.assign({
      //   method: 'POST',
      //   headers: {
      //     'accept': '*/*',
      //     'content-type': 'application/json',
      //     'x-webgw-appid': '180020010001265922',
      //     'x-webgw-version': '2.0'
      //   },
      //   body: body
      // }, item.extra);

      const options = {
        method: 'POST',
        headers: {
          'x-webgw-appId': '180020010001265922',
          'x-webgw-version': '2.0',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
        referrer: location.href,
        cache: undefined,
        credentials: undefined,
        mode: undefined,
        redirect: undefined,
        // referrerPolicy: undefined,
        // referrerPolicy: 'no-referrer',
      };
      
      // log({ test: item.name, hasReferrerPolicy: Object.prototype.hasOwnProperty.call(options, 'referrerPolicy'),
      //   referrerPolicy: String(options.referrerPolicy), valueType: typeof options.referrerPolicy });
      // try {
      //   new Request(url, options);
      //   log({ test: item.name, requestConstruction: '通过' });
      // } catch (e) {
      //   log({ test: item.name, requestConstruction: '失败', error: e.message });
      // }
      // var controller = new AbortController();
      // options.signal = controller.signal;
      // var timer = setTimeout(function () { controller.abort(); }, 15000);
      try {
        var response = await window.fetch(url, options);
        var headers = {};
        response.headers.forEach(function (v, k) { headers[k] = v; });
        log({ test: item.name, status: response.status, responseHeaders: headers, response: await response.text() });
      } catch (e) {
        log({ test: item.name, fetchError: e.message, errorName: e.name });

        
        
      } finally { 
        log({ test: item.name, op: options });
        // clearTimeout(timer); 
      }
    }
    log({ done: true });
  } finally { button.disabled = false; }
};
</script>
</html>
